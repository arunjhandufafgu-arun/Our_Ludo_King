plugins {
    id 'com.android.application'
}

android {
    namespace "com.vinaykpro.ludoking"
    compileSdk 36

    defaultConfig {
        applicationId "com.vinaykpro.ludoking"
        minSdk 24
        targetSdk 36
        versionCode 1562
        versionName "8.0.0.278"
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
        checkDependencies = false
        ignoreWarnings = true
        quiet = true
        disable 'LockedOrientationActivity', 'DiscouragedApi', 'NonConstantResourceId', 'MissingTranslation', 'ExtraTranslation', 'ProtectedPermissions', 'InvalidPackage', 'OldTargetApi', 'ExpiredTargetSdkVersion', 'GradleDependency'
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            crunchPngs false
            if (file("${rootDir}/debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
        }
        release {
            crunchPngs false
            minifyEnabled false
            if (file("${rootDir}/debug.keystore").exists()) {
                signingConfig signingConfigs.debugConfig
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-unchecked']
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    testImplementation 'junit:junit:4.13.2'
}