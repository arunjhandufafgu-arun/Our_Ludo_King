plugins {
    id 'com.android.application'
}

android {
    namespace "com.vinaykpro.ludoking"
    compileSdk 36

    defaultConfig {
        applicationId "com.vinaykpro.ludoking"
        minSdk 19
        targetSdk 33
        versionCode 1562
        versionName "8.0.0.278"
        multiDexEnabled true
        resourceConfigurations += ["en"]
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/androidx.*',
                'META-INF/PROGUARD/*',
                'META-INF/services/**',
                'META-INF/com/**',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'kotlin/**',
                'DebugProbesKt.bin'
            ]
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
        checkDependencies = false
        ignoreWarnings = true
        quiet = true
        disable 'LockedOrientationActivity', 'DiscouragedApi', 'NonConstantResourceId', 'MissingTranslation', 'ExtraTranslation', 'ProtectedPermissions', 'InvalidPackage', 'OldTargetApi', 'ExpiredTargetSdkVersion', 'GradleDependency'
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        debug {
            crunchPngs false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debugConfig
        }
        release {
            crunchPngs false
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debugConfig
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-unchecked']
}

tasks.matching { it.name.startsWith("lint") || it.name.contains("Lint") }.configureEach {
    enabled = false
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    testImplementation 'junit:junit:4.13.2'
}