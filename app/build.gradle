plugins {
    id 'com.android.application'
}

android {
    namespace "com.vinaykpro.ludoking"
    compileSdk 36

    defaultConfig {
        applicationId "com.vinaykpro.ludoking"
        minSdk 21
        targetSdk 34
        versionCode 1562
        versionName "8.0.0.278"
        resourceConfigurations += ["en"]
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/androidx.*',
                'META-INF/PROGUARD/*',
                'META-INF/services/**',
                'META-INF/com/**',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'kotlin/**',
                'DebugProbesKt.bin'
            ]
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
        checkDependencies = false
        ignoreWarnings = true
        quiet = true
        disable 'LockedOrientationActivity', 'DiscouragedApi', 'NonConstantResourceId', 'MissingTranslation', 'ExtraTranslation', 'ProtectedPermissions', 'InvalidPackage', 'OldTargetApi', 'ExpiredTargetSdkVersion', 'GradleDependency'
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        debug {
            crunchPngs false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debugConfig
        }
        release {
            crunchPngs false
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debugConfig
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-unchecked']
}

tasks.matching { it.name.startsWith("lint") || it.name.contains("Lint") }.configureEach {
    enabled = false
}

tasks.register('deduplicateDrawableResources') {
    doLast {
        def drawableDir = file("src/main/res/drawable")
        if (!drawableDir.exists()) return
        def priority = ['.png': 1, '.jpeg': 2, '.jpg': 3, '.gif': 4, '.xml': 5, '.webp': 6]
        def groups = [:].withDefault { [] }
        drawableDir.listFiles()?.each { File f ->
            if (!f.isFile()) return
            def name = f.name
            def dot = name.lastIndexOf('.')
            if (dot <= 0) return
            def stem = name.substring(0, dot)
            def ext = name.substring(dot).toLowerCase(Locale.ROOT)
            if (priority.containsKey(ext)) {
                groups[stem] << [rank: priority[ext], file: f]
            }
        }
        groups.each { stem, items ->
            if (items.size() > 1) {
                items.sort { a, b -> a.rank <=> b.rank }
                items.drop(1).each { entry ->
                    entry.file.delete()
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'deduplicateDrawableResources'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    testImplementation 'junit:junit:4.13.2'
}