name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-Advance Testing & Environment Preparation
        run: |
          set -e
          java -version
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          rm -rf wrapper/dists

          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f app/src/main/res/drawable/fireworksimg.gif ] && [ ! -f app/src/main/res/drawable/fireworksimg.png ]; then
            cp app/src/main/res/raw/ludotopmainicon.gif app/src/main/res/drawable/fireworksimg.gif
          fi

          python3 -c '
          import os, struct, zlib, xml.etree.ElementTree as ET
          for root, _, files in os.walk("app/src/main/res"):
              for f in sorted(files):
                  p = os.path.join(root, f)
                  data = open(p, "rb").read()
                  ext = os.path.splitext(f)[1].lower()
                  if ext == ".png":
                      assert data.startswith(b"\x89PNG\r\n\x1a\n") and data.endswith(b"IEND\xaeB`\x82"), f"Corrupted PNG: {p}"
                  elif ext == ".xml":
                      ET.fromstring(data)
          main_java = open("app/src/main/java/com/vinaykpro/ludoking/MainActivity.java").read()
          assert "rapidTapCount >= 3" in main_java and "forceSixOnRoll" in main_java, "3-tap dice rule missing in MainActivity.java"
          print("Pre-advance testing passed: all resources and 3-tap dice logic verified.")
          '

      - name: Build Local Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Post-Build APK Verification
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          python3 -c '
          import os, zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          assert os.path.isfile(apk) and os.path.getsize(apk) > 10_000_000, "APK missing or too small"
          with zipfile.ZipFile(apk, "r") as z:
              names = set(z.namelist())
              assert "AndroidManifest.xml" in names, "Missing AndroidManifest.xml"
              assert "classes.dex" in names, "Missing classes.dex"
              assert "resources.arsc" in names, "Missing resources.arsc"
          print("Post-build verification passed: app-debug.apk is valid and ready to install.")
          '

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
