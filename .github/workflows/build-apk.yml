name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Drawable Assets and Gradlew Permissions
        run: |
          chmod +x ./gradlew
          rm -rf wrapper/dists
          if [ ! -f app/src/main/res/drawable/fireworksimg.gif ] && [ ! -f app/src/main/res/drawable/fireworksimg.png ]; then
            if command -v ffmpeg >/dev/null 2>&1 && [ -f app/src/main/res/raw/fireworks.mp4 ]; then
              ffmpeg -y -i app/src/main/res/raw/fireworks.mp4 -vf "fps=10,scale=320:-1:flags=lanczos" app/src/main/res/drawable/fireworksimg.gif || cp app/src/main/res/raw/ludotopmainicon.gif app/src/main/res/drawable/fireworksimg.gif
            else
              cp app/src/main/res/raw/ludotopmainicon.gif app/src/main/res/drawable/fireworksimg.gif
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -Pandroid.nonFinalResIds=false --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
