name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Pre-Advance Testing & Environment Preparation
        run: |
          set -e
          java -version
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          rm -rf wrapper/dists

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ] && [ -d "/opt/android/sdk" ]; then
            SDK_DIR="/opt/android/sdk"
          fi
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "sdk.dir=$SDK_DIR" > local.properties
          if [ -n "$GITHUB_ENV" ]; then
            echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          fi

          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ ! -f app/src/main/res/drawable/fireworksimg.gif ] && [ ! -f app/src/main/res/drawable/fireworksimg.png ]; then
            cp app/src/main/res/raw/ludotopmainicon.gif app/src/main/res/drawable/fireworksimg.gif
          fi

          python3 -c '
          import os, xml.etree.ElementTree as ET
          for root, _, files in os.walk("app/src/main/res"):
              for f in sorted(files):
                  p = os.path.join(root, f)
                  data = open(p, "rb").read()
                  ext = os.path.splitext(f)[1].lower()
                  if ext == ".png":
                      assert data.startswith(b"\x89PNG\r\n\x1a\n") and data.endswith(b"IEND\xaeB`\x82"), f"Corrupted PNG: {p}"
                  elif ext == ".xml":
                      ET.fromstring(data)
          manifest_xml = open("app/src/main/AndroidManifest.xml").read()
          assert manifest_xml.count("android.intent.category.LAUNCHER") == 1, "AndroidManifest.xml must have exactly 1 LAUNCHER activity to prevent duplicate app icons"
          app_gradle = open("app/build.gradle").read()
          assert "JavaVersion.VERSION_17" in app_gradle, "Java 17 compatibility missing in app/build.gradle"
          assert "abortOnError = false" in app_gradle, "Lint abortOnError = false missing in app/build.gradle"
          main_java = open("app/src/main/java/com/vinaykpro/ludoking/MainActivity.java").read()
          assert "tryLockWinnerColor" in main_java and "selectSmartBoardDiceRoll" in main_java, "Winner lock logic missing in MainActivity.java"
          assert os.path.isfile("app/src/test/java/com/vinaykpro/ludoking/DiceLogicTest.java"), "DiceLogicTest.java missing"
          print("Pre-advance testing passed: single launcher icon, Java 17 config, lint config, resources, unit tests, and 3-tap winner lock logic verified.")
          '

      - name: Run Unit Tests & Build Local Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Post-Build APK Verification
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          python3 -c '
          import os, zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          assert os.path.isfile(apk) and os.path.getsize(apk) > 10_000_000, "APK missing or too small"
          with zipfile.ZipFile(apk, "r") as z:
              names = set(z.namelist())
              assert "AndroidManifest.xml" in names, "Missing AndroidManifest.xml"
              assert "classes.dex" in names, "Missing classes.dex"
              assert "resources.arsc" in names, "Missing resources.arsc"
          print("Post-build verification passed: app-debug.apk is valid and ready to install.")
          '

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
